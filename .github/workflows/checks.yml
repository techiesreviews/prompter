# The unit tests on every push to dev or main and on every pull request (`kit unit` runs the same files locally).
name: checks
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/*.test.mjs
